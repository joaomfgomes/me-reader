# Integração contínua: lint e testes a cada push e pull request.
# Não usa chaves reais; os testes nunca chamam fornecedores pagos.
name: CI

on:
  push:
  pull_request:

# O workflow só precisa de ler o código.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Esta ação não publica a etiqueta curta "v10", só versões completas.
      - uses: astral-sh/setup-uv@v10.3.3
      # --locked falha se o uv.lock não corresponder ao pyproject.toml, em vez
      # de o atualizar em silêncio. A versão de Python vem de backend/.python-version.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    name: Frontend (tipos + Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # A versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo, para verificar todos os commits e não só o último.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
