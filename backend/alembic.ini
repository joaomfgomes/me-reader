# Configuração do Alembic, a ferramenta de migrações de esquema.
# Uso habitual: "make migrate" na raiz do repositório.

[alembic]
# %(here)s é a pasta deste ficheiro; assim o Alembic encontra as migrações
# seja qual for a pasta de onde é corrido.
script_location = %(here)s/migrations

# Junta a pasta backend/ ao caminho de importação do Python, para o
# migrations/env.py conseguir fazer "from app... import ...".
prepend_sys_path = %(here)s
# Separador usado em listas de caminhos como a de cima: o do sistema operativo.
path_separator = os

# O endereço da base de dados não fica aqui: o migrations/env.py vai buscá-lo
# à configuração da aplicação (variável READER_DATA_DIR).
